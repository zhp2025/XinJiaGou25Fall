{% extends "base.html" %}

{% block title %}登录 - AICove{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>登录</h1>
        <form id="login-form">
            <div class="form-group">
                <label>用户名：</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>密码：</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">登录</button>
        </form>
        <p class="auth-link">
            <a href="{{ url_for('auth.forgot_password') }}">忘记密码？</a> | 
            <a href="{{ url_for('auth.register') }}">立即注册</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
    padding: 2rem;
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
}

.auth-card {
    background: white;
    padding: 3rem 2.5rem;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 450px;
    animation: fadeIn 0.6s ease-out;
    position: relative;
    overflow: hidden;
}

.auth-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--primary-color), var(--purple-color));
}

.auth-card h1 {
    text-align: center;
    margin-bottom: 2.5rem;
    color: var(--primary-color);
    font-size: 2rem;
    font-weight: 600;
    position: relative;
}

.btn-block {
    width: 100%;
    margin-top: 0.5rem;
    padding: 0.875rem;
    font-size: 1rem;
    font-weight: 500;
}

.auth-link {
    text-align: center;
    margin-top: 1.75rem;
    color: var(--text-light);
    font-size: 0.95rem;
}

.auth-link a {
    color: var(--primary-color);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s ease;
}

.auth-link a:hover {
    color: #357ABD;
    text-decoration: underline;
}
</style>
{% endblock %}
