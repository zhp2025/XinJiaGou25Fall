{% extends "base.html" %}

{% block title %}找回密码 - AICove{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>找回密码</h1>
        <form id="forgot-password-form">
            <div class="form-group">
                <label>用户名：</label>
                <input type="text" name="username" id="username" required>
            </div>
            <div class="form-group">
                <label>二级问题：</label>
                <p id="security-question" class="security-question-display"></p>
            </div>
            <div class="form-group">
                <label>二级问题答案：</label>
                <input type="text" name="security_answer" id="security_answer" required>
            </div>
            <div class="form-group">
                <label>新密码：</label>
                <input type="password" name="new_password" id="new_password" required>
            </div>
            <div class="form-group">
                <label>确认新密码：</label>
                <input type="password" name="confirm_password" id="confirm_password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">重置密码</button>
        </form>
        <p class="auth-link">
            <a href="{{ url_for('auth.login') }}">返回登录</a> | 
            <a href="{{ url_for('auth.register') }}">立即注册</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60vh;
    padding: 2rem;
}

.auth-card {
    background: white;
    padding: 3rem;
    border-radius: 8px;
    box-shadow: var(--shadow-lg);
    width: 100%;
    max-width: 400px;
}

.auth-card h1 {
    text-align: center;
    margin-bottom: 2rem;
    color: var(--primary-color);
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 500;
}

.form-group input {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    font-size: 1rem;
}

.form-group input:focus {
    outline: none;
    border-color: var(--primary-color);
}

.security-question-display {
    padding: 0.75rem;
    background: var(--light-color);
    border-radius: 4px;
    color: var(--primary-color);
    font-weight: 500;
    margin-top: 0.5rem;
}

.btn-block {
    width: 100%;
    margin-top: 1rem;
}

.auth-link {
    text-align: center;
    margin-top: 1.5rem;
    color: var(--text-light);
}

.auth-link a {
    color: var(--primary-color);
    text-decoration: none;
}
</style>
{% endblock %}

{% block extra_js %}
<script>
// 当用户名输入时获取二级问题
document.getElementById('username').addEventListener('blur', async function() {
    const username = this.value.trim();
    if (!username) return;
    
    const result = await apiRequest(`/api/auth/security-question?username=${username}`, 'GET');
    if (result.success) {
        document.getElementById('security-question').textContent = result.question;
    } else {
        document.getElementById('security-question').textContent = '用户不存在';
    }
});

// 表单提交
document.getElementById('forgot-password-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const securityAnswer = document.getElementById('security_answer').value;
    const newPassword = document.getElementById('new_password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    if (newPassword !== confirmPassword) {
        showMessage('两次输入的密码不一致', 'error');
        return;
    }
    
    const result = await apiRequest('/auth/forgot-password', 'POST', {
        username: username,
        security_answer: securityAnswer,
        new_password: newPassword
    });
    
    if (result.success) {
        showMessage('密码重置成功，请重新登录', 'success');
        setTimeout(() => {
            window.location.href = '/auth/login';
        }, 1500);
    } else {
        showMessage(result.message || '重置失败', 'error');
    }
});
</script>
{% endblock %}
