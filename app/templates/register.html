{% extends "base.html" %}

{% block title %}注册 - AICove{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>注册</h1>
        <form id="register-form">
            <div class="form-group">
                <label>账号：<span class="required">*</span></label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>昵称：</label>
                <input type="text" name="nickname" placeholder="留空将自动生成">
            </div>
            <div class="form-group">
                <label>邮箱：</label>
                <input type="email" name="email" placeholder="选填">
            </div>
            <div class="form-group">
                <label>密码：<span class="required">*</span></label>
                <input type="password" name="password" required>
            </div>
            <div class="form-group">
                <label>二级问题（用于找回密码）：<span class="required">*</span></label>
                <input type="text" name="security_question" placeholder="请自定义一个问题" required>
            </div>
            <div class="form-group">
                <label>问题答案：<span class="required">*</span></label>
                <input type="text" name="security_answer" required>
            </div>
            <div class="form-group">
                <label>感兴趣的领域（可选，可多选）：</label>
                <div class="interests-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="interests" value="LLM"> 大语言模型
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="interests" value="计算机视觉"> 计算机视觉
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="interests" value="深度学习"> 深度学习
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="interests" value="强化学习"> 强化学习
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="interests" value="AI伦理"> AI伦理
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="interests" value="AI应用"> AI应用
                    </label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">注册</button>
        </form>
        <p class="auth-link">已有账号？<a href="{{ url_for('auth.login') }}">立即登录</a></p>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
    padding: 2rem;
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
}

.auth-card {
    background: white;
    padding: 3rem 2.5rem;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 500px;
    animation: fadeIn 0.6s ease-out;
    position: relative;
    overflow: hidden;
}

.auth-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--primary-color), var(--purple-color));
}

.auth-card h1 {
    text-align: center;
    margin-bottom: 2.5rem;
    color: var(--primary-color);
    font-size: 2rem;
    font-weight: 600;
}

.interests-group {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    margin-top: 0.75rem;
    padding: 1rem;
    background: var(--light-color);
    border-radius: 8px;
}

.checkbox-label {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-weight: normal;
    cursor: pointer;
    padding: 0.5rem;
    border-radius: 6px;
    transition: background 0.3s ease;
}

.checkbox-label:hover {
    background: rgba(74, 144, 226, 0.1);
}

.checkbox-label input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
}

.btn-block {
    width: 100%;
    margin-top: 0.5rem;
    padding: 0.875rem;
    font-size: 1rem;
    font-weight: 500;
}

.auth-link {
    text-align: center;
    margin-top: 1.75rem;
    color: var(--text-light);
    font-size: 0.95rem;
}

.auth-link a {
    color: var(--primary-color);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s ease;
}

.auth-link a:hover {
    color: #357ABD;
    text-decoration: underline;
}
</style>
{% endblock %}
